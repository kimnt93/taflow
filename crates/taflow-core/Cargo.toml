[package]
name = "taflow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust core for TAFlow batch and streaming technical analysis"
repository.workspace = true
readme = "../../README.md"
keywords = ["technical-analysis", "finance", "trading", "ta-lib"]
categories = ["science", "mathematics"]

[dependencies]
thiserror.workspace = true
num-traits.workspace = true
multiversion = "0.7"

[features]
default = ["simd"]
# Retained for backwards compatibility; kernels are now plain auto-vectorizable
# loops with multiversion runtime dispatch, so the flag is a no-op.
simd = []

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "stream_bench"
harness = false
