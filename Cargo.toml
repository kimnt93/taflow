[workspace]
resolver = "2"
members = ["crates/taflow-core", "crates/taflow-python"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/kimnt93/taflow"

[workspace.dependencies]
thiserror = "2"
num-traits = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
